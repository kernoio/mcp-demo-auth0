services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: northwharf
      POSTGRES_PASSWORD: northwharf
      POSTGRES_DB: northwharf
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - northwharf-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northwharf -d northwharf"]
      interval: 2s
      timeout: 5s
      retries: 30

  auth0:
    build: .
    image: northwharf-demo:local
    command: ["node", "dist/identity/main.js"]
    ports:
      - "${AUTH0_HOST_PORT:-3000}:3000"
    environment:
      AUTH0_PORT: "3000"
      DATABASE_URL: postgres://northwharf:northwharf@postgres:5432/northwharf
      AUTH0_ISSUER: http://localhost:3000
      AUTH0_AUDIENCE: http://localhost:8080/mcp
      AUTH0_MGMT_CLIENT_ID: ${AUTH0_MGMT_CLIENT_ID:-northwharf-management}
      AUTH0_MGMT_CLIENT_SECRET: ${AUTH0_MGMT_CLIENT_SECRET:-northwharf-management-secret}
      AUTH0_OWNER_SUBJECT: auth0|6728f0a1b2c3d4e5f6789012
      AUTH0_OWNER_EMAIL: ada.north@northwharf.example
      AUTH0_OWNER_PASSWORD: ${AUTH0_OWNER_PASSWORD:-ada-north-local}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  app:
    build: .
    image: northwharf-demo:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://northwharf:northwharf@postgres:5432/northwharf
      AUTH0_ISSUER: http://localhost:3000
      AUTH0_AUDIENCE: http://localhost:8080/mcp
      AUTH0_JWKS_URL: http://auth0:3000/.well-known/jwks.json
      AUTH0_OWNER_SUBJECT: auth0|6728f0a1b2c3d4e5f6789012
    depends_on:
      postgres:
        condition: service_healthy
      auth0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

volumes:
  northwharf-pg:

networks:
  default:
    name: northwharf-demo
    ipam:
      config:
        - subnet: 10.250.28.0/24
